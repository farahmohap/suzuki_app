name: suzuki_app
description: "سوزوكي — منصة التنقل المشترك الذكية"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # ── Dependency Injection ──────────────────────────────────────────────────
  get_it: ^8.0.2
  injectable: ^2.4.4

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Functional Programming (Either / Option) ──────────────────────────────
  fpdart: ^1.1.0

  # ── Routing ───────────────────────────────────────────────────────────────
  go_router: ^14.6.1

  # ── Local Storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # ── Responsive UI ─────────────────────────────────────────────────────────
  flutter_screenutil: ^5.9.3

  # ── Fonts ─────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Localisation / Formatting ─────────────────────────────────────────────
  intl: ^0.19.0

  # ── OpenStreetMap & Location ──────────────────────────────────────────────
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # ── Firebase (coexists with REST layer) ───────────────────────────────────
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.8

  # ── Helpers ───────────────────────────────────────────────────────────────
  url_launcher: ^6.2.5
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.12
  injectable_generator: ^2.6.2
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
